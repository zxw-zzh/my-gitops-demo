apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: rollouts-demo
spec:
  replicas: 5   # 启动 5 个副本，方便观察 20%(1个) -> 50%(3个) -> 100%(5个) 的变化
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: rollouts-demo
  template:
    metadata:
      labels:
        app: rollouts-demo
    spec:
      containers:
      - name: rollouts-demo
        image: argoproj/rollouts-demo:blue   # 初始部署“蓝色”版本
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
  strategy:
    canary:
      steps:
      - setWeight: 20     # 第1步：先切 20% 流量（启动 1 个新版本 Pod）
      - pause: {}         # 第2步：自动暂停，等待人工审核确认
      - setWeight: 50     # 第3步：人工点 Promote 后，放大到 50% 流量（3 个新版本 Pod）
      - pause: {duration: 20s}  # 第4步：自动观察 20 秒，没问题自动 100% 全量替换
---
apiVersion: v1
kind: Service
metadata:
  name: rollouts-demo-svc
spec:
  type: NodePort
  ports:
  - port: 80
    targetPort: http
    protocol: TCP
    name: http
    nodePort: 30090     # 暴露在本地 30090 端口
  selector:
    app: rollouts-demo
