apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base

namePrefix: prod-

replicas:
  - name: my-nginx
    count: 3

images:
  - name: nginx
    newTag: 1.26

patches:
  - target:
      kind: Service
      name: my-nginx-svc
    patch: |-
      - op: replace
        path: /spec/ports/0/nodePort
        value: 30082
